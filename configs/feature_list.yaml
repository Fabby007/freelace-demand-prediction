# Feature list configuration (DEV-005 / REF-001 Section 6)
#
# Populated by DEV-005 (Feature Engineering Pipeline). Model training code
# (DEV-008/DEV-009) must read the feature list from here, never hardcode it
# inline. This list is generated by src/features/build_features.py
# (ENGINEERED_COLUMNS) - kept in sync by
# tests/test_feature_engineering.py::test_engineered_columns_match_config.

target:
  column: target_value  # set via DEV-002 Target Decision Record (real demand vs. proxy) - populated by DEV-006

identifier_columns:
  - district
  - year
  - month
  - vehicle_type

base_columns:
  - new_registrations
  - vehicle_population
  - population
  - population_density

engineered_columns:
  - reg_lag_1
  - reg_lag_2
  - reg_growth_pct
  - change_from_lag_2
  - rolling_mean_3
  - rolling_std_3
  - quarter          # null - dataset is yearly-only, no month data (REF-001 Section 5)
  - month_sin         # null - same reason
  - month_cos         # null - same reason
  - vehicles_per_1000_people   # null for now - population not yet acquired, see DEV-005 module docstring
  # demand_lag_1 intentionally NOT included: configs/target_config.yaml
  # is_real_demand_target=false (Fallback path, DEV-002 Target Decision
  # Record) - there is no real observed demand series to lag.

provenance_columns:
  - new_registrations_source_id
  - new_registrations_source_url
  - vehicle_population_source_id
  - vehicle_population_source_url
  - retrieved_date

data_quality_columns:
  - new_registrations_quality_note
  - vehicle_population_quality_note
  - data_quality_flag
