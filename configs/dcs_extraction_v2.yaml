# Settings for the v2 DCS table extractor and its validation checks
# (src/data/extract_dcs_tables_v2.py, src/data/validate_dcs_extraction.py).
# See specs/reference/REF-009-architecture-decisions.md ADR-036.

handbook_edition_year: 2024
expected_years: [2019, 2020, 2021, 2022, 2023]

tables:
  "9.3":
    metric: vehicle_population
    title_keyword: Revenue
    labels:
      - Motor Cars
      - Motor Bicycles
      - Three Weelers
      - Private Bus
      - Dual Purpose Vehicles
      - Motor Lorry
      - Land Vehicles
      - Other
    optional_labels: []
  "9.4":
    metric: new_registrations
    title_keyword: Registrations
    labels:
      - Ambulance
      - Car
      - Commercial (Bus)
      - Dual Purpose (Commercial)
      - Land Vehicle
      - Land Vehicle (Small)
      - Lorry Trailer / Bowser
      - Motor Cycle
      - Motor Hearse
      - Motor Lorry (Commercial)
      - Motor Tricycle Van
      - Other Special Purpose Vehicle
      - Primer Mover
      - Single Cab
      - Special Purpose Vehicle
      - Three Wheeler
      - Tractor Trailer / Bowser
    # Printed by some districts only. Kept exactly as printed. "Grade A" is NOT
    # mapped to Car: it fills the Car row in Trincomalee, but the PDF does not
    # state that they are the same thing.
    optional_labels:
      - Quadricycle
      - Grade A

total_label: Total

# "Total" row of DMT's "New Registration of Motor Vehicles" table, all vehicle
# classes (data/raw/dmt/DMT_Vehicle_Population_2014-2025.pdf).
dmt_national_new_registrations_all_vehicles:
  2019: 367303
  2020: 202628
  2021: 33850
  2022: 20511
  2023: 27890

# All thresholds only raise flags. No check ever changes a value.
validation:
  # Sum of categories vs printed Total: differences at or below this are ignored.
  sum_tolerance: 0
  # Year-on-year log change, relative to the median for all districts in the same
  # year and category. 0.25 is roughly a 28% move against the national pattern.
  yoy_relative_log_threshold: 0.25
  yoy_min_base: 100
  # A value below this share of BOTH neighbouring years is a dip (and the
  # inverse is a spike).
  dip_ratio: 0.5
  # Identical-column checks need this many non-zero values in common.
  min_matching_values: 5
  # A Table 9.3 column sharing this many distinct values of at least the minimum
  # size with the same year of Table 9.4 is treated as a possible copy.
  cross_table_min_shared_values: 4
  cross_table_min_value: 10
  # New registrations above this share of licensed vehicles, same category and year.
  registration_to_stock_ratio: 0.5
  # Printed registration Totals, relative to the median district in the same year:
  # 1.0 is a log difference of about 2.7 times, either way.
  total_peer_log_threshold: 1.0

# Links every validation flag to its entry in data/corrections/source_anomalies_v2.csv.
# The first matching rule wins. Any flag with no rule fails the tests, so a new
# problem cannot go undocumented.
flag_review:
  - {check_id: licences_match_registrations, district: Ampara, anomaly_id: L01}
  - {check_id: yoy_against_national_pattern, district: Ampara, year: 2020, anomaly_id: L01}
  - {check_id: yoy_against_national_pattern, district: Ampara, anomaly_id: L12}
