# Model hyperparameter configuration (DEV-007 / DEV-008 / DEV-009)
#
# Model training code must read hyperparameters from here, not hardcode them.
# Values below are placeholders/typical starting points, not final tuned values —
# real tuning happens in DEV-008 (XGBoost) / DEV-009 (LSTM) using train/validation
# periods only (never the test period).

random_seed: 42

baseline:
  moving_average_window: 3

xgboost:
  n_estimators: 300
  learning_rate: 0.05
  max_depth: 4
  min_child_weight: 1
  subsample: 0.8
  colsample_bytree: 0.8
  tuning_search_space:
    n_estimators: [100, 300, 500]
    learning_rate: [0.01, 0.05, 0.1]
    max_depth: [3, 4, 5, 6]
    min_child_weight: [1, 3, 5]
    subsample: [0.7, 0.8, 1.0]
    colsample_bytree: [0.7, 0.8, 1.0]

lstm:
  lookback_months: 6
  lstm_layers: 1
  lstm_units: 32
  dropout: 0.2
  epochs: 100
  batch_size: 16
  early_stopping_patience: 10
